<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>올리브바스켓</title>
<meta name="description" content="책에서 모은 아포리즘을 한 구절씩">
<meta name="theme-color" content="#5a6740">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/noto-serif-kr@5.2.5/index.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="style.css?v=37">
<!-- 시작 화면(로고 · 이름): 설치한 앱으로 열면 휴대폰이 이미 로고 · 이름 화면을 보여 주므로 한 번 더 띄우지 않는다 (사용자 지시 2026-11-04).
     브라우저로 열 때만, 그것도 처음 한 번만 (당겨서 새로고침 때는 생략) -->
<script>try { if (sessionStorage.getItem('ob_splash') || matchMedia('(display-mode: standalone)').matches || navigator.standalone) document.documentElement.classList.add('nosplash'); } catch {}</script>
</head>
<body class="lock">
<div class="splash" id="splash" aria-hidden="true">
  <img src="icons/icon-512.png" alt="">
  <div class="splash-name">올리브바스켓</div>
</div>
<div class="bg" id="bgA" aria-hidden="true"></div>
<div class="bg" id="bgB" aria-hidden="true"></div>
<div class="ptr" id="ptr" aria-hidden="true">↻</div>
<header class="ob-top">
  <a class="ob-logo" href="/app"><span class="leaf-mark" aria-hidden="true"></span>올리브바스켓</a>
  <button type="button" class="ob-src" id="srcBtn" aria-haspopup="dialog" hidden><span id="srcName">전체</span></button>
  <span class="ob-acc" data-xms-account></span>
</header>
<main class="stage" id="stage" aria-live="polite">
  <div class="pos" id="pos"></div>
  <div class="stars top-stars" id="stars" aria-label="중요도"></div>

  <div class="quote-card">
    <p class="quote" id="quote">&nbsp;</p>
    <div class="meta" id="meta">
      <div class="source" id="source"></div>
    </div>
  </div>
</main>

<!-- 출처별로 보기: 고른 출처의 구절만 넘겨 본다 (기본 = 전체) -->
<div class="src-sheet" id="srcSheet" hidden>
  <div class="src-panel" role="dialog" aria-label="출처별로 보기">
    <div class="src-head">출처별로 보기</div>
    <div class="src-find"><input type="search" id="srcQ" placeholder="출처 이름 검색" aria-label="검색" autocomplete="off" enterkeyhint="search"><div class="seg" id="srcMode" role="group" aria-label="무엇으로 찾을지"></div></div>
    <div class="src-list" id="srcList"></div>
  </div>
</div>

<!-- 듣기: 지금 구절부터 소리 내어 읽고 다음 구절로 이어 간다 (출처를 골랐으면 그 출처만) -->
<button type="button" class="ob-fab ob-listen" id="listenBtn" aria-pressed="false" hidden>
  <svg class="i-play" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9.5v5h3.5l4.5 4v-13l-4.5 4H4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
  <svg class="i-stop" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="2" fill="currentColor"/></svg>
  <span class="t">듣기</span>
</button>
<button type="button" class="ob-lset" id="ttsBtn" aria-label="듣기 설정" aria-haspopup="dialog" hidden>
  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h9M18 7h2M4 17h2M11 17h9"/><circle cx="15.5" cy="7" r="2.3"/><circle cx="8.5" cy="17" r="2.3"/></svg>
</button>
<!-- 듣기 설정: 빠르기 · 반복 · 괄호 안 읽기 -->
<div class="src-sheet" id="ttsSheet" hidden>
  <div class="src-panel tts-panel" role="dialog" aria-label="듣기 설정">
    <div class="src-head">듣기 설정</div>
    <div class="tts-row"><span class="tts-l">빠르기</span><div class="seg" id="ttsRate" role="group" aria-label="빠르기"></div></div>
    <div class="tts-row"><span class="tts-l">반복</span><div class="seg" id="ttsLoop" role="group" aria-label="반복"></div></div>
    <div class="tts-row"><span class="tts-l">괄호 안</span><div class="seg" id="ttsParen" role="group" aria-label="괄호 안 글"></div></div>
  </div>
</div>

<a class="ob-fab" id="addLink" href="/basket" aria-label="올리브바스켓에 담기"><span class="ob-fab-plus" aria-hidden="true">+</span>담기</a>

<script src="app.js?v=42"></script>
</body>
</html>
