/* ── 가름끈 모아보기 ─────────────────── */
async function askDeleteMark(key){
  const p=key.split("/"),bk=p[0],ch=+p[1],unit=bk==="시편"?"편":"장";
  if(!await askConfirm(`${bk} ${ch}${unit} 가름끈을 삭제하시겠습니까?`))return;
  const i=marks.indexOf(key);
  if(i>=0)marks.splice(i,1);
  markdel[key]=Date.now();delete markt[key];
  store.set("marks",JSON.stringify(marks));
  store.set("markt",JSON.stringify(markt));
  store.set("markdel",JSON.stringify(markdel));
  renderBmBody();   // 목록 갱신
  updateNav();      // 현재 쪽 가름끈 상태 반영
  toast("가름끈을 삭제했습니다");
}
function renderBmBody(){
  const keys=marks.slice().sort((a,b)=>((markt[b]||0)-(markt[a]||0))||(a<b?-1:a>b?1:0));   // 최근에 끼운 것부터(추가 시각 기준 → 기기 공통 순서)
  let out="";
  for(const key of keys){
    const p=key.split("/"),bk=p[0],ch=+p[1],pg=+(p[2]||0);
    const unit=bk==="시편"?"편":"장";
    out+=`<div class="bm-card"><button class="bm-go" data-key="${esc(key)}"><span class="mini"></span>`+
         `<span class="bm-where">${esc(bk)} ${ch}${unit}</span></button></div>`;
  }
  $("bmBody").innerHTML=out?`<div class="bm-grid">${out}</div>`:`<p class="hl-empty">아직 끼운 가름끈이 없습니다.<br>본문 우측의 가름끈을 눌러 표시하세요.<br><small style="opacity:.8">목록에서 항목을 꾹 누르면 삭제할 수 있어요.</small></p>`;
  $("bmBody").querySelectorAll(".bm-go").forEach(b=>{
    const key=b.dataset.key;
    let t=null,fired=false,px=0,py=0;
    const go=()=>{                       // 짧게 탭 → 해당 쪽으로 이동
      const p=key.split("/");
      cur={book:p[0],chap:+p[1]};qtMode=false;
      closeSheet();render(+(p[2]||0));   // 저장된 페이지로 이동
    };
    const cancel=()=>{if(t){clearTimeout(t);t=null;}};
    b.addEventListener("pointerdown",e=>{fired=false;px=e.clientX;py=e.clientY;cancel();
      t=setTimeout(()=>{                 // 꾹 누르면 → 삭제 확인
        t=null;fired=true;
        if(navigator.vibrate)try{navigator.vibrate(15)}catch(e){}
        askDeleteMark(key);
      },LP_MS);
    },{passive:true});
    b.addEventListener("pointermove",e=>{if(t){const dx=e.clientX-px,dy=e.clientY-py;if(dx*dx+dy*dy>100)cancel();}},{passive:true});
    b.addEventListener("pointercancel",cancel,{passive:true});
    b.onclick=()=>{cancel();if(fired){fired=false;return;}go();};   // 꾹 눌러 삭제한 직후 클릭은 무시
  });
  $("bmBody").scrollTop=0;
}
function openBm(){
  doCloseSheets();
  renderBmBody();
  $("scrim").classList.add("open");$("bmSheet").classList.add("open");
  pushSheetState();
}
$("bmBtn").onclick=()=>$("bmSheet").classList.contains("open")?closeSheet():openBm();

/* ── 바텀시트 ─────────────────────────── */
/* 시트를 열 때 히스토리를 쌓아, 폰 뒤로가기가 앱 종료가 아니라 시트 닫기가 되게 한다.
   책·장 선택은 2단계: 책 목록(1) → 장 격자(2). 장 격자에서 뒤로가기 → 책 목록으로 */
let sheetDepth=0;
function pushSheetState(n){n=n||1;disarmExit(true);if(sheetDepth>=n)return;try{history.pushState({sheet:n},"")}catch(e){}sheetDepth=n}
/* 잠·큐티 같은 '임시 화면'에 들어갈 때 히스토리 한 칸을 미리 쌓는다 — 뒤로가기가
   임시 화면 복귀에 쓰여도 본문의 종료 가드(base)가 소모되지 않게 (시트와 같은 요령) */
function pushViewState(){disarmExit(true);try{history.pushState({rb:"view"},"")}catch(e){}}
function doCloseSheets(){$("scrim").classList.remove("open");$("sheet").classList.remove("open");$("setSheet").classList.remove("open");$("hlSheet").classList.remove("open");$("bmSheet").classList.remove("open");$("planFull").classList.remove("open");$("ppScrim").classList.remove("open")}
/* 본문 화면에서 뒤로가기를 누르면 곧장 앱을 벗어나지 않도록 히스토리에 한 칸(base)을 미리 쌓아 둔다.
   서랍은 그 위에 쌓이므로 서랍 닫기는 base로, 본문 화면에서의 뒤로가기는 root로 떨어진다. */
try{history.replaceState({rb:"root"},"");history.pushState({rb:"base"},"");}catch(e){}
/* 본문 화면에서 뒤로가기 → 안내만 하고 머무른다. 2초 안에 한 번 더 누르면 그대로 종료.
   두 번째 뒤로가기는 가드를 다시 쌓지 않아 시스템이 처리한다(웹앱은 스스로 앱을 끝낼 수 없다). */
const EXIT_WINDOW=2000;
let exitArmed=false,exitTimer=null;
function armExit(){
  exitArmed=true;
  toast("뒤로가기를 한 번 더 누르면 종료됩니다");
  if(navigator.vibrate)try{navigator.vibrate(15)}catch(e){}
  clearTimeout(exitTimer);
  exitTimer=setTimeout(()=>disarmExit(true),EXIT_WINDOW);
}
/* restore=true면 가드 한 칸을 다시 쌓아, 다음 뒤로가기를 다시 붙잡는다 */
function disarmExit(restore){
  if(!exitArmed)return;
  exitArmed=false;clearTimeout(exitTimer);
  if(restore)try{history.pushState({rb:"base"},"")}catch(e){}
}
window.addEventListener("popstate",e=>{
  const st=e.state;
  if(st&&st.sheet){                    // 시트 안의 한 단계 위로 (장 격자 → 책 목록)
    sheetDepth=st.sheet;
    if($("sheet").classList.contains("open")&&pickedBook!==null){pickedBook=null;renderSheet()}
    if($("hlSheet").classList.contains("open")&&hlBook!==null){hlBook=null;renderHl()}
    if(sheetDepth<2)closePlanPop();     // 통독표 장별 이동 창 → 통독표로
    return;
  }
  const hadSheet=!!document.querySelector(".sheet.open,.set-sheet.open,.full-view.open");

const PLAN_RANGES=Array.from({length:10},(_,i)=>[i*18+1,i*18+18]);   // 18일씩 열 구간으로 나눠 보여 준다

const planChapCache={};

/* 그 날의 읽은 횟수 = 그 날 읽을 장들의 최소 읽음 횟수 (한 장이라도 덜 읽었으면 그 횟수로 본다) */

function planRangeCount(a,b){let m=5;for(let d=a;d<=b;d++){m=Math.min(m,planReadCount(d));if(!m)break}return m}

const PLAN_CHAP_END={"93|18:18~20":1,"111|잠 22:17~24":1,"119|스 5:2~6":1};   // "날|표기" → 물결 뒤는 장
function planSpans(d){
  const out=[];let book=null;
  (PLAN180[d-1]||"").split(",").forEach(tok=>{
    const raw=tok.trim();

/* ── 성경 본문 검색 ───────────────────
   성경 서랍 맨 위 검색창에 낱말을 넣으면 구약·신약 전체에서 성경 순서대로 찾아 보여 준다.
   쉼표로 나누면 "사랑,소망"처럼 낱말이 모두 들어 있는 절만 나온다(그리고/AND). */
let bibleQuery="";          // 성경 본문 검색어 (서랍 열 때 초기화)
let bsTimer=null;           // 글자를 칠 때마다 3만 절을 훑지 않게 잠깐 모았다 한 번만 찾기
const BS_CAP=300;           // 한 번에 보여 주는 상한 (건수는 전부 세어 알려 준다)
const rxEsc=w=>w.replace(/[-\/\\^$*+?.()|[\]{}]/g,x=>"\\"+x);
/* 찾은 낱말을 <mark>으로 감싸기 — 쪼개어 바꿔치기가 아니라
   나눈 조각을 각각 esc()해야 본문 속 <·& 가 태그로 샐지 않는다 */
function bsMark(t,terms){
  if(!terms.length)return esc(t);
  const re=new RegExp("("+terms.map(rxEsc).join("|")+")","gi");
  return t.split(re).map((x,i)=>i%2?`<mark>${esc(x)}</mark>`:esc(x)).join("");
}
function bsTerms(q){return q.split(",").map(x=>x.trim()).filter(Boolean)}
function bibleSearchHtml(q){
  const terms=bsTerms(q);
  if(!terms.length)return "";
  /* 한글은 대·소문자가 없으므로 영문자가 섞인 검색어일 때만 소문자로 내려 비교한다 */
  const ci=/[a-z]/i.test(q),keys=ci?terms.map(w=>w.toLowerCase()):terms;
  const res=[];let total=0;
  for(const b of ALL){
    const bk=b[0],n=b[1];
    for(let c=1;c<=n;c++){
      const arr=TEXT[bk+"/"+c];
      if(!arr)continue;
      for(let i=0;i<arr.length;i++){
        const raw=arr[i];
        if(!raw)continue;
        const hay=ci?raw.toLowerCase():raw;
        let ok=true;
        for(let k=0;k<keys.length;k++)if(hay.indexOf(keys[k])<0){ok=false;break}
        if(!ok)continue;
        total++;
        if(res.length<BS_CAP)res.push({bk,c,v:i+1,t:raw.replace(/⟪|⟫/g,"")});
      }
    }
  }
  if(!total)return `<p class="hl-empty">"${esc(q)}" 검색 결과가 없습니다.</p>`;
  let html=`<div class="hl-hint">검색 결과 ${total}건${total>BS_CAP?` — 앞 ${BS_CAP}건만 표시`:""} · 구약·신약 전체에서 성경 순서로</div>`;
  for(const r of res){
    const unit=r.bk==="시편"?"편":"장";
    html+=`<button class="bs-item" data-key="${esc(r.bk)}/${r.c}" data-v="${r.v}">`+
      `<span class="ref">${esc(r.bk)} ${r.c}${unit} ${r.v}절</span>`+
      `<span class="txt">${bsMark(r.t,terms)}</span></button>`;
  }
  return html;
}
/* 검색창 아랫부분만 다시 그린다 — 입력 포커스를 잃지 않게 검색창은 그대로 둔다 */

/* ── 확인창 (네이티브 confirm 대체 — 도메인 안 보임) ── */
let cfmStarVal=1;
/* 기다리는 동안 같은 창에 '…하는 중' (버튼 없음, 바깥 눌러도 안 닫힘). 다음 askConfirm 이 그대로 이어받는다 */
function showBusy(msg){
  $("cfmMsg").textContent=msg;
  $("cfmStars").hidden=true;$("cfmBtns").hidden=true;
  $("cfmBox").classList.add("busy");
  $("cfmScrim").onclick=null;
  $("cfmScrim").classList.add("open");
}
function hideBusy(){$("cfmScrim").classList.remove("open");$("cfmBox").classList.remove("busy");$("cfmBtns").hidden=false;}
function askConfirm(msg,opt){
  const noBackdrop=opt&&opt.noBackdropClose;   // 바깥 탭으로 안 닫히게(연타가 배경에 꽂혀 닫히는 것 방지)
  $("cfmCancel").textContent=(opt&&opt.cancelText)||"취소";   // 질문 성격에 따라 '취소' 대신 '아니오' 등
  $("cfmOk").textContent=(opt&&opt.okText)||"확인";
  const starBox=$("cfmStars");   // opt.stars 가 있으면 별 1~3 고르기(고른 값은 cfmStarVal)
  starBox.hidden=!(opt&&opt.stars);
  if(opt&&opt.stars){
    cfmStarVal=opt.stars;
    const paint=()=>starBox.querySelectorAll("button").forEach(b=>b.classList.toggle("on",+b.dataset.s<=cfmStarVal));
    paint();
    starBox.onclick=e=>{const b=e.target.closest("button");if(b){cfmStarVal=+b.dataset.s;paint();}};
  }
  $("cfmBox").classList.remove("busy");$("cfmBtns").hidden=false;   // '담는 중' 창에서 이어질 때
  $("cfmBtns").classList.toggle("stack",!!(opt&&opt.stack));   // 버튼을 위아래로
  $("cfmOk").classList.toggle("pos",!!(opt&&opt.okClass==="pos"));   // 지우기 같은 위험 확인(붉은색)이 아닌 선택
  const dismiss=opt&&"dismiss" in opt?opt.dismiss:false;   // 바깥을 눌러 닫을 때 돌려줄 값
  const onPick=opt&&opt.onPick;   // 누른 그 입력 안에서 바로 해야 하는 일(복사 · 새 창) — 약속(then)으로 미루면 막히는 기기가 있다
  const guardMs=(opt&&opt.guardMs)||0;         // 여는 직후 이 시간(ms) 동안은 어떤 탭도 무시(연타가 버튼에 꽂혀 닫히는 것 방지)
  const openAt=Date.now();
  const live=()=>Date.now()-openAt>=guardMs;
  return new Promise(res=>{
    const scrim=$("cfmScrim"),ok=$("cfmOk"),cancel=$("cfmCancel");
    $("cfmMsg").textContent=msg;
    scrim.classList.add("open");
    /* 롱프레스로 열렸을 때, 그 손가락을 '떼는' 동작(스크림 위에서 시작하지 않은 release)이
       곧바로 확인창을 닫거나 삭제를 확정하지 않도록 — 확인창 위에서 '새로 누른' 제스처만 유효. */
    let ready=false;
    const arm=()=>{ready=true;};
    scrim.addEventListener("pointerdown",arm);
    const done=v=>{
      scrim.classList.remove("open");
      scrim.removeEventListener("pointerdown",arm);
      ok.onclick=cancel.onclick=scrim.onclick=null;
      if(onPick)try{onPick(v)}catch(e){}
      res(v);
    };
    ok.onclick=()=>{if(ready&&live())done(true);};
    cancel.onclick=()=>{if(ready&&live())done(false);};
    scrim.onclick=e=>{if(!noBackdrop&&ready&&live()&&e.target===scrim)done(dismiss);};   // 바깥 탭하면 취소(창 위에서 누른 경우만; noBackdrop·가드시간이면 무시)
  });
}

/* ── 계정 로그인 & 동기화 (이 사이트 회원 로그인 — xms) ─────────────
   로그인은 이 사이트 회원 로그인(/member/login, 로그인 유지). 형광펜·가름끈·읽음·별표·설정을 회원별로 서버(/api/sync)에 둔다.
   (2026-11-04 구글 로그인 · Firestore 기록은 모두 옮겼고 연결을 끊었다.) 합치는 규칙은 예전 그대로(mergeCloud — 항목별 최신 동작이 이김). 서버는 버전 번호로
   '내가 받은 뒤 다른 기기가 먼저 올렸는지'만 가린다 → 그랬으면(409) 받은 걸 합쳐 다시 올린다.
   다른 기기 변경은 화면으로 돌아올 때 · 1분마다 받아 온다. 로그인 안 하면 이 브라우저에만 저장. */
(function initSync(){
  const st=$("authStatus"),btn=$("authBtn");
  let user=null,ver=0,timer=null,busy=false,again=false,first=true;

  const collect=()=>({marks,hl:hls,hlt,hldel,markt,markdel,reads,readt,plan,plant,qthl,qthldel,
                      stars,starat:starAt,stardel:starDel,set:setVal,updatedAt:Date.now()});
  const api=(method,body)=>fetch("/api/sync",{method,credentials:"same-origin",cache:"no-store",
    headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined});

  const origSet=store.set;
  /* 값이 실제로 바뀐 저장만 올림 (읽던 위치 last 는 기기별이라 안 올림) */
  store.set=(k,v)=>{const old=store.get(k);origSet(k,v);if(k!=="last"&&k!=="lastPage"&&String(v)!==old)schedule();};

  function mergeCloud(d,initial){
    if(!d)return;
    const before=JSON.stringify([hls,marks,reads])+"|"+Object.keys(qthl).sort().join();   // 재렌더 필요 여부 판단용
    /* 형광펜: 절별로 '추가 시각' vs '삭제 시각' 중 최신 동작이 이김 (LWW) → 한쪽에서 지우면 다른쪽도 지워짐.
       들어오는 클라우드 삭제 이력은 미리 정리해 비대한 옛 문서(오프라인 캐시 포함)도 가볍게 병합. */
    const addC=d.hlt||{},delC=trimDels(d.hldel),clHl=d.hl||{};
    const clPresent=new Set();                       // 클라우드에 살아있는 형광펜 절 (O(1) 조회용)
    for(const k in clHl)for(const v of (clHl[k]||[]))clPresent.add(k+"/"+v);
    const ids=new Set([...Object.keys(hlt),...Object.keys(hldel),...Object.keys(addC),...Object.keys(delC),...clPresent]);
    const nHls={},nHlt={},nHldel={};
    ids.forEach(id=>{
      const aT=Math.max(hlt[id]||0,addC[id]||0,clPresent.has(id)?1:0);
      const dT=Math.max(hldel[id]||0,delC[id]||0);
      if(aT>dT){nHlt[id]=aT;const s=id.lastIndexOf("/");(nHls[id.slice(0,s)]||(nHls[id.slice(0,s)]=[])).push(+id.slice(s+1));}
      else if(dT>0)nHldel[id]=dT;
    });
    for(const k in nHls)nHls[k].sort((a,b)=>a-b);
    hls=nHls;hlt=nHlt;hldel=trimDels(nHldel);
    origSet("hl",JSON.stringify(hls));origSet("hlt",JSON.stringify(hlt));origSet("hldel",JSON.stringify(hldel));
    /* 가름끈: 키별로 추가/삭제 최신 동작이 이김 (LWW) */
    const maT=d.markt||{},mdT=trimDels(d.markdel),clMarks=d.marks||[];
    const lMarkSet=new Set(marks),cMarkSet=new Set(clMarks);   // includes 대신 O(1) 조회
    const mids=new Set([...lMarkSet,...cMarkSet,...Object.keys(markt),...Object.keys(markdel),...Object.keys(maT),...Object.keys(mdT)]);
    const nMarks=[],nMarkt={},nMarkdel={};
    mids.forEach(id=>{
      const aT=Math.max(markt[id]||0,maT[id]||0,lMarkSet.has(id)?1:0,cMarkSet.has(id)?1:0);
      const dT=Math.max(markdel[id]||0,mdT[id]||0);
      if(aT>dT){nMarkt[id]=aT;nMarks.push(id);}
      else if(dT>0)nMarkdel[id]=dT;
    });
    marks=nMarks;markt=nMarkt;markdel=trimDels(nMarkdel);
    origSet("marks",JSON.stringify(marks));origSet("markt",JSON.stringify(markt));origSet("markdel",JSON.stringify(markdel));
    /* 읽음: 키별로 변경 시각이 더 최근인 값이 이김 (LWW) → 횟수 증가뿐 아니라 해제·초기화도 동기화 */
    const cr=d.reads||{},crt=d.readt||{};
    const rids=new Set([...Object.keys(reads),...Object.keys(readt),...Object.keys(cr),...Object.keys(crt)]);
    const nReads={},nReadt={};
    rids.forEach(k=>{
      const lt=Math.max(readt[k]||0,reads[k]?1:0),ct=Math.max(crt[k]||0,cr[k]?1:0);
      let val;
      if(ct>lt)val=cr[k]||0; else if(lt>ct)val=reads[k]||0; else val=Math.max(reads[k]||0,cr[k]||0);  // 동시각(레거시)엔 큰 값
      const t=Math.max(lt,ct);
      if(t>0)nReadt[k]=t;
      if(val>0)nReads[k]=val;
    });
    const readsBefore=JSON.stringify(reads);
    reads=nReads;readt=nReadt;
    origSet("reads",JSON.stringify(reads));origSet("readt",JSON.stringify(readt));
    /* 통독표 색은 장별 읽음 표시를 따른다 — 값이 실제로 바뀐 경우에만 다시 그림(스크롤 튐 방지) */
    if(JSON.stringify(reads)!==readsBefore)refreshPlanViews();
    /* 옛 날짜 색칠 기록(plan) — 지금은 화면에 쓰지 않지만, 예전 버전을 쓰는 기기의 값이 지워지지 않게 그대로 합친다 */
    const cp=d.plan||{},cpt=d.plant||{};
    const pids=new Set([...Object.keys(plan),...Object.keys(plant),...Object.keys(cp),...Object.keys(cpt)]);
    const nPlan={},nPlant={};
    pids.forEach(k=>{
      const lt=Math.max(plant[k]||0,plan[k]?1:0),ct=Math.max(cpt[k]||0,cp[k]?1:0);
      let val;
      if(ct>lt)val=cp[k]||0; else if(lt>ct)val=plan[k]||0; else val=Math.max(plan[k]||0,cp[k]||0);
      const t=Math.max(lt,ct);
      if(t>0)nPlant[k]=t;
      if(val>0)nPlan[k]=val;
    });
    plan=nPlan;plant=nPlant;
    origSet("plan",JSON.stringify(plan));origSet("plant",JSON.stringify(plant));
    /* 큐티 형광펜: 절 내용을 담은 항목이라 id별로 '칠한 시각 vs 지운 시각' LWW로만 합친다 */
    const cq=d.qthl||{},cqd=trimDels(d.qthldel);
    const qids=new Set([...Object.keys(qthl),...Object.keys(qthldel),...Object.keys(cq),...Object.keys(cqd)]);
    const nQ={},nQd={};
    qids.forEach(id=>{
      const lo=qthl[id],co=cq[id];
      const lT=(lo&&lo.at)||0,cT=(co&&co.at)||0;
      const aT=Math.max(lT,cT),dT=Math.max(qthldel[id]||0,cqd[id]||0);
      if(aT>dT&&(lo||co))nQ[id]=lT>=cT?(lo||co):(co||lo);
      else if(dT>0)nQd[id]=dT;
    });
    qthl=capQt(nQ);qthldel=trimDels(nQd);
    origSet("qthl",JSON.stringify(qthl));origSet("qthldel",JSON.stringify(qthldel));
    /* 별표: 가름끈과 같은 id별 추가/삭제 LWW */
    const csA=d.starat||{},csD=trimDels(d.stardel),clStars=d.stars||[];
    const lSt=new Set(stars),cSt=new Set(clStars);
    const sidsAll=new Set([...lSt,...cSt,...Object.keys(starAt),...Object.keys(starDel),...Object.keys(csA),...Object.keys(csD)]);
    const nSt=[],nStA={},nStD={};
    sidsAll.forEach(id=>{
      const aT=Math.max(starAt[id]||0,csA[id]||0,lSt.has(id)?1:0,cSt.has(id)?1:0);
      const dT=Math.max(starDel[id]||0,csD[id]||0);
      if(aT>dT){nStA[id]=aT;nSt.push(id);}
      else if(dT>0)nStD[id]=dT;
    });
    stars=nSt;starAt=nStA;starDel=trimDels(nStD);
    origSet("stars",JSON.stringify(stars));origSet("starat",JSON.stringify(starAt));origSet("stardel",JSON.stringify(starDel));
    /* 설정은 최초 로그인 때만 클라우드에서 가져옴. 읽던 위치(last)는 동기화하지 않음(기기별 독립) */
    if(initial&&d.set)for(const kk in d.set)if(SETTINGS[kk]){setVal[kk]=d.set[kk];origSet("set."+kk,d.set[kk]);}
    /* 보이는 데이터가 실제로 바뀐 경우에만 재조판 — 내 push의 메아리 스냅샷마다 전체 재렌더 방지 */
    if(initial||JSON.stringify([hls,marks,reads])+"|"+Object.keys(qthl).sort().join()!==before){applySettings();render(curPage);}   // 지금 보던 쪽은 유지
  }

  const acctBtn=$("acctBtn"),acctIco=acctBtn.querySelector(".acct-ico"),ICO=acctIco.innerHTML;
  let pop=null;
  function closePop(){if(pop){pop.classList.remove("open");}}
  function openPop(){
    if(!pop){pop=document.createElement("div");pop.className="acct-pop";pop.setAttribute("role","menu");document.body.append(pop);
      document.addEventListener("pointerdown",e=>{if(pop.classList.contains("open")&&!pop.contains(e.target)&&!acctBtn.contains(e.target))closePop();});}
    const esc=t=>String(t||"").replace(/[&<>"]/g,c=>"&#"+c.charCodeAt(0)+";");
    pop.innerHTML='<div class="who">'+esc(user.name?user.name+" · "+user.login_id:user.login_id)+'</div>'
      +'<a role="menuitem" href="/member/mypage">내 정보</a>'
      +(user.admin?'<a role="menuitem" href="/xms/">관리</a>':'')
      +'<button type="button" role="menuitem" data-out>로그아웃</button>';
    pop.querySelector("[data-out]").onclick=()=>{closePop();logout();};
    const r=acctBtn.getBoundingClientRect();
    const w=pop.offsetWidth||180;   // 메뉴 순서가 뒤집혀(왼쪽) 있어도 화면 안에
    pop.style.left=Math.max(8,Math.min(innerWidth-8-w,r.right-w))+"px";
    requestAnimationFrame(()=>pop.classList.add("open"));
  }
  acctBtn.onclick=()=>{
    if(!user){location.href="/member/login?next=/app";return;}
    pop&&pop.classList.contains("open")?closePop():openPop();
  };
  /* 로그아웃하면 이 기기의 내 기록을 비운다(서버에는 그대로 → 다시 로그인하면 돌아옴).
     rb.owner = 지금 이 기기 기록의 주인(로그인 아이디). 다른 곳(계정 메뉴 · 다른 탭)에서 로그아웃했거나
     다른 사람이 로그인하면, 다음에 열 때 이걸 보고 비운다. 설정 · 읽던 위치는 기기 것이라 남긴다. */
  const DATA_KEYS=["marks","markt","markdel","hl","hlt","hldel","qthl","qthldel","stars","starat","stardel","reads","readt","plan","plant"];
  function wipe(){
    clearTimeout(timer);
    marks=[];markt={};markdel={};hls={};hlt={};hldel={};qthl={};qthldel={};
    stars=[];starAt={};starDel={};reads={};readt={};plan={};plant={};
    for(const k of DATA_KEYS.concat("owner"))try{localStorage.removeItem("rb."+k)}catch(e){}
    refreshPlanViews();applySettings();render(curPage);
  }
  function setUser(u){
    if(!u&&user)wipe();   // 로그인돼 있다가 풀림(로그아웃 · 다른 곳에서 로그아웃) → 비움
    user=u;
    acctBtn.classList.toggle("on",!!u);
    acctBtn.setAttribute("aria-label",u?"내 계정":"로그인");
    acctIco.innerHTML=u&&u.avatar?'<img alt="" src="'+String(u.avatar).replace(/"/g,"")+'">':ICO;
    if(!u)closePop();
    if(u){
      btn.textContent="로그아웃";
      st.textContent=(u.login_id||u.name||"회원")+" · 동기화 켜짐";
    }else{
      btn.textContent="로그인";
      st.textContent="로그인하면 다른 기기와 형광펜·가름끈·읽은 기록이 동기화됩니다.";
      first=true;ver=0;
    }
  }
  /* 서버 것을 받아 합친다 */
  async function pull(){
    const r=await api("GET");
    if(r.status===401){setUser(null);return false;}
    if(!r.ok)throw new Error("sync "+r.status);
    const j=await r.json();
    if(j.doc)mergeCloud(j.doc,first);
    first=false;ver=j.ver||0;
    return true;
  }
  /* 이 기기 것을 올린다 (다른 기기가 먼저 올렸으면 합쳐서 다시) */
  async function push(){
    if(!user)return;
    if(busy){again=true;return;}
    busy=true;
    try{
      for(let i=0;i<4;i++){
        const r=await api("PUT",{doc:collect(),base:ver});
        if(r.status===409){const j=await r.json();if(j.doc)mergeCloud(j.doc,false);ver=j.ver||0;continue;}
        if(r.status===401){setUser(null);break;}
        if(r.ok){const j=await r.json();ver=j.ver;}
        break;
      }
    }catch(e){/* 오프라인 — 연결되면 다시 */}
    finally{busy=false;if(again){again=false;schedule();}}
  }
  function schedule(){ if(!user)return; clearTimeout(timer);timer=setTimeout(()=>push(),800); }

  async function start(){
    try{
      const r=await fetch("/xms-api/me",{credentials:"same-origin",cache:"no-store"});
      const me=r.ok?await r.json():{guest:true};
      const owner=store.get("owner");
      if(!me.login_id){if(owner)wipe();setUser(null);return;}
      if(owner&&owner!==me.login_id)wipe();   // 다른 사람 기록이 남아 있으면 비우고 내 것을 받는다
      origSet("owner",me.login_id);
      setUser(me);
      /* 로그아웃을 누르기 전까지 로그인이 풀리지 않게: 열 때마다 로그인 기한을 다시 늘린다 */
      fetch("/xms-api/keep",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:"{}"}).catch(()=>{});
      if(await pull())await push();   // 이 기기에만 있던 것도 서버로
    }catch(e){
      if(!user)st.textContent="(인터넷이 연결되면 로그인 상태를 확인합니다)";
    }
  }

  btn.onclick=()=>{ if(!user){location.href="/member/login?next=/app";return;} logout(); };
  async function logout(){
    if(!await askConfirm("로그아웃할까요?\n이 기기에서는 형광펜·가름끈·별표·읽은 기록이 지워지고,\n다시 로그인하면 그대로 돌아옵니다."))return;
    clearTimeout(timer);
    try{await push();}catch(e){}   // 아직 안 올라간 변경을 먼저 서버에
    try{await fetch("/xms-api/logout",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:"{}"});}catch(e){}
    setUser(null);toast("로그아웃했습니다");
  }

  start();
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&user)pull().catch(()=>{}); });
  setInterval(()=>{ if(user&&!document.hidden&&navigator.onLine!==false)pull().catch(()=>{}); },60000);
  /* 인터넷이 다시 붙으면 오프라인 동안 바꾼 것을 올림 */
  window.addEventListener("online",()=>{ if(user)pull().then(()=>push()).catch(()=>{}); else start(); });
})();
</script>
<script>
/* 장 듣기: 음성이 있는 장(LISTEN)에서만 재생기를 보여 준다. 음성은 Opus 20k(webm) 하나. 속도는 눌러서 0.8 → 1.0 → 1.25 → 1.5 → 2.0 (음 높이는 그대로) */
(function(){
  const box=document.getElementById("listen"),au=document.getElementById("lsAudio"),btn=document.getElementById("lsPlay"),sp=document.getElementById("lsSpeed"),tm=document.getElementById("lsTime"),bar=document.getElementById("lsBar");
  const SPEEDS=[0.8,1,1.25,1.5,2];let si=1,label="이 장 듣기",now="",bad=false;
  /* 음성이 있는 장 → 파일 이름 (assets/audio/<이름>.webm) */
  const LISTEN={"창세기/1":"genesis-1"},HAS={},AV="2";   // AV: 음성을 다시 만들면 올린다(브라우저가 하루 동안 옛 파일을 들고 있어서 — 2026-11-14 '창세기 한장' 으로 들린 일)
  for(let i=1;i<=31;i++)LISTEN["잠언/"+i]="proverbs-"+i;
  try{const v=+localStorage.getItem("lsSpeed");if(SPEEDS.includes(v))si=SPEEDS.indexOf(v)}catch(e){}
  const ICON={play:'<path d="M8 5v14l11-7z"/>',pause:'<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>'};
  const fmt=t=>isFinite(t)?Math.floor(t/60)+":"+String(Math.floor(t%60)).padStart(2,"0"):"0:00";
  const paint=()=>{btn.querySelector("svg").innerHTML=au.paused?ICON.play:ICON.pause;btn.setAttribute("aria-label",au.paused?"듣기":"멈춤");
    sp.textContent=(SPEEDS[si]%1?String(SPEEDS[si]):SPEEDS[si].toFixed(1))+"×";
    tm.textContent=bad?"이 기기에선 재생이 안 돼요":au.currentTime||!au.paused?fmt(au.currentTime)+" / "+fmt(au.duration):label;
    bar.style.setProperty("--p",au.duration?au.currentTime/au.duration:0)};
  au.preservesPitch=true;
  btn.addEventListener("click",()=>{if(au.paused){au.playbackRate=SPEEDS[si];au.play().catch(()=>{})}else au.pause()});
  const menu=document.getElementById("lsMenu"),sx=v=>(v%1?String(v):v.toFixed(1))+"×";
  menu.innerHTML=SPEEDS.map((v,i)=>`<button type="button" role="menuitemradio" data-i="${i}">${sx(v)}</button>`).join("");
  const openMenu=o=>{menu.classList.toggle("open",o);sp.setAttribute("aria-expanded",o);menu.querySelectorAll("button").forEach((b,i)=>{b.classList.toggle("on",i===si);b.setAttribute("aria-checked",i===si)});};
  sp.addEventListener("click",e=>{e.stopPropagation();openMenu(!menu.classList.contains("open"))});
  menu.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;e.stopPropagation();si=+b.dataset.i;au.playbackRate=SPEEDS[si];try{localStorage.setItem("lsSpeed",SPEEDS[si])}catch(err){}paint();openMenu(false)});
  document.addEventListener("click",e=>{if(menu.classList.contains("open")&&!e.target.closest("#listen"))openMenu(false)},true);
  document.addEventListener("keydown",e=>{if(e.key==="Escape")openMenu(false)});
  ["play","pause","timeupdate","loadedmetadata","ended"].forEach(ev=>au.addEventListener(ev,paint));
  au.addEventListener("error",()=>{if(au.getAttribute("src")){bad=true;paint()}});   // 오래된 기기(Opus 못 읽음)
  au.addEventListener("ratechange",()=>{if(au.playbackRate!==SPEEDS[si])au.playbackRate=SPEEDS[si]});
  window.updateListen=function(){
    const key=typeof cur!=="undefined"?cur.book+"/"+(+cur.chap):"";
    let here=!!LISTEN[key]&&!(typeof qtMode!=="undefined"&&qtMode);
    if(here&&HAS[key]===undefined){   // 아직 만들어지지 않은 장은 재생기를 숨긴다(파일이 있는지 한 번만 확인)
      HAS[key]=null;fetch("assets/audio/"+LISTEN[key]+".webm?v="+AV,{method:"HEAD"}).then(r=>{HAS[key]=r.ok;updateListen()}).catch(()=>{HAS[key]=false});
    }
    if(HAS[key]!==true)here=false;
    box.classList.toggle("on",here);
    if(here&&now!==key){   // 다른 장으로 오면 그 장 음성으로 바꾼다
      now=key;bad=false;au.pause();au.src="assets/audio/"+LISTEN[key]+".webm?v="+AV;
      label=cur.book+" "+cur.chap+(cur.book==="시편"?"편":"장")+" 듣기";box.setAttribute("aria-label",label);paint();
    }
    if(!here&&!au.paused)au.pause();
    if(document.body.classList.contains("has-listen")!==here){document.body.classList.toggle("has-listen",here);if(typeof render==="function")render(typeof curPage!=="undefined"?curPage:0);}   // 본문 칸이 줄었으니 쪽을 다시 나눈다
  };
  paint();updateListen();
})();
</script>
