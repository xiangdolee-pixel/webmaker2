<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>해골 빌딩의 용사</title>
<meta name="description" content="사다리를 타고 빌딩을 넘나들며 해골 병사를 물리치고 보스를 쓰러뜨리는 두뇌 게임">
<meta name="theme-color" content="#2f9bf0">
<link rel="icon" type="image/png" href="img/icon.png?v=2">
<link rel="apple-touch-icon" href="img/icon.png?v=2">
<link rel="preload" as="image" href="img/bg.webp?v=2">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>

<!-- 처음 화면 -->
<main id="title" class="screen">
  <span class="acc" data-xms-account></span>
  <div class="t-box">
    <p class="t-sub">사다리 두뇌 게임</p>
    <h1 class="t-name">해골 빌딩의<br><b>용사</b></h1>
    <div class="t-art"><img src="img/hero.webp?v=2" alt="" width="260" height="300"><img src="img/skel.webp?v=2" alt="" width="260" height="300"></div>
    <div class="t-stat" id="tStat" hidden></div>
    <button type="button" class="btn big" id="btnStart">시작하기</button>
    <button type="button" class="btn ghost" id="btnNew" hidden>처음부터 다시</button>
    <ul class="t-how">
      <li>내 숫자보다 <b>작은</b> 해골만 이길 수 있어요. 이기면 그 힘이 내 것!</li>
      <li>사다리로 <b>바로 옆 빌딩</b>까지만 갈 수 있어요.</li>
      <li>마지막에 기다리는 <b>보스</b>를 쓰러뜨리면 레벨 클리어!</li>
    </ul>
  </div>
</main>

<!-- 게임 화면 -->
<div id="game" class="screen" hidden>
  <header class="hud">
    <button type="button" class="hb" id="btnMenu" aria-label="그만하기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5M6.5 10v9.5h11V10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="hv"><span>레벨</span><b id="hLv">1</b></div>
    <div class="hv"><span>시간</span><b id="hTime">0.0</b></div>
    <div class="hv"><span>점수</span><b id="hScore">0</b></div>
    <button type="button" class="hb" id="btnRetry" aria-label="이 레벨 다시 하기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12a7 7 0 1 0 2.2-5.1M5 4.5v4h4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button type="button" class="hb" id="btnSnd" aria-label="소리"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5z" fill="currentColor"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="mute" d="m15.5 9.5 5 5m0-5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <button type="button" class="hb save" id="btnSave">저장</button>
  </header>
  <div id="stage"><div id="fit"><div id="world"></div></div></div>
  <div class="tip" id="tip" hidden></div>
</div>

<!-- 알림 창 -->
<div class="dlg" id="dlg" hidden><div class="dlg-box" id="dlgBox" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" aria-live="polite"></div>

<script type="module" src="js/game.js?v=2"></script>
</body>
</html>
