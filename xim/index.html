<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>xim — 사이트 통합 관리</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b4cca'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='15' fill='white' text-anchor='middle'%3Exim%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main class="login" id="login" hidden>
    <form class="card login-card" id="login-form">
      <h1><span class="logo">xim</span></h1>
      <p>고객 사이트 통합 관리</p>
      <label class="field"><span>운영자 비밀번호</span>
        <input class="input" type="password" name="password" autocomplete="current-password" required>
      </label>
      <label class="field" id="otp-field" hidden><span>구글 OTP 번호</span>
        <input class="input otp-input" name="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000">
        <small>하루에 한 번만 넣으면 됩니다. 24시간 동안은 이 브라우저에서 비밀번호만으로 로그인돼요.</small>
      </label>
      <label class="st-check login-remember"><input type="checkbox" name="remember" value="1"><span><b>이 PC 기억하기</b> <small>1년 동안 이 브라우저에서는 로그인 없이 바로 열립니다. 내 PC 에서만 켜 주세요.</small></span></label>
      <button class="btn primary" type="submit">로그인</button>
      <p class="err" id="login-err" role="alert"></p>
    </form>
  </main>

  <div id="app" class="shell" hidden>
    <aside class="side">
      <span class="brand logo">xim</span>
      <nav class="tabs side-nav" id="nav" aria-label="메뉴"></nav>
      <!-- 밖으로 가는 바로가기 (탭이 아니라 새 창) -->
      <a class="side-link" href="https://portfolio.plators.com/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18"/></svg>포트폴리오<span class="ext" aria-hidden="true">↗</span></a>
      <button class="btn sm side-out" type="button" id="logout">로그아웃</button>
    </aside>
    <main class="wrap">
      <section class="tiles" id="tiles" aria-label="요약"></section>
      <section id="view"></section>
    </main>
  </div>
</body>
</html>
